# Pacote estático de um app web (Dockerfile desta pasta)
server {
    listen 8080;
    root /usr/share/nginx/html;

    # prontidão: o CI local, a homologação e a produção esperam 200 em /health
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # rotas do app voltam para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
