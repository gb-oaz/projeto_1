rx="6"/></g><text class="label-strong" x="574" y="26">contratacoes</text><rect class="chip" x="803.9" y="12" width="144" height="20" rx="10"/><text class="chip-text" x="876" y="26" text-anchor="middle">partição: contaId</text><line class="divider" x1="560" y1="40" x2="960" y2="40"/><text class="mono" x="574" y="60">_id</text><text class="mono" x="574" y="78">contaId → contas</text><text class="mono" x="574" y="96">sigla · nomeConta · tipoConta  (cópia)</text><text class="mono" x="574" y="114">moduloId → modulos</text><text class="mono" x="574" y="132">nomeModulo  (cópia)</text><text class="mono" x="574" y="150">plano: MENSAL | ANUAL</text><text class="mono" x="574" y="168">desde · ate</text><text class="mono" x="574" y="186">automatica</text><line class="divider" x1="560" y1="202" x2="960" y2="202"/><text class="uml-keyword" x="574" y="222">índices</text><text class="mono" x="574" y="242">único: contaId + moduloId + desde</text><text class="mono" x="574" y="260">moduloId + sigla  (clientes, RF-124)</text><g id="c-cobrancas" filter="url(#sombra)"><rect class="node-green" x="560" y="350" width="400" height="360" rx="6"/></g><text class="label-strong" x="574" y="376">cobrancas</text><rect class="chip" x="803.9" y="362" width="144" height="20" rx="10"/><text class="chip-text" x="876" y="376" text-anchor="middle">partição: contaId</text><line class="divider" x1="560" y1="390" x2="960" y2="390"/><text class="mono" x="574" y="410">_id</text><text class="mono" x="574" y="428">contaId → contas</text><text class="mono" x="574" y="446">contratacaoId → contratacoes</text><text class="mono" x="574" y="464">moduloId → modulos</text><text class="mono" x="574" y="482">competencia · fechadaEm</text><text class="mono" x="574" y="500">staffAtivos · participantesAtivos</text><text class="mono" x="574" y="518">valorPorStaff · valorPorParticipante</text><text class="mono" x="574" y="536">subtotal · descontoPorVolume</text><text class="mono" x="574" y="554">descontoAnual · total</text><rect class="node-blue" x="572" y="568" width="376" height="72" rx="4"/><text class="label" x="582" y="587">faixasAplicadas[ ]  · cópia do fechamento</text><text class="mono" x="586" y="608">inicio · fim · percentual</text><text class="mono" x="586" y="626">usuarios · desconto</text><line class="divider" x1="560" y1="652" x2="960" y2="652"/><text class="uml-keyword" x="574" y="672">índices</text><text class="mono" x="574" y="692">único: contaId + contratacaoId + competencia</text><g id="c-contas" filter="url(#sombra)"><rect class="node-external" x="1080" y="0" width="280" height="98" rx="6"/></g><text class="label-strong" x="1094" y="26">contas</text><rect class="chip" x="1233.1" y="12" width="115" height="20" rx="10"/><text class="chip-text" x="1291" y="26" text-anchor="middle">16_identidade</text><line class="divider" x1="1080" y1="40" x2="1360" y2="40"/><text class="mono" x="1094" y="60">_id</text><text class="mono" x="1094" y="78">sigla</text><g id="c-usuarios" filter="url(#sombra)"><rect class="node-external" x="1080" y="146" width="280" height="80" rx="6"/></g><text class="label-strong" x="1094" y="172">usuarios</text><rect class="chip" x="1233.1" y="158" width="115" height="20" rx="10"/><text class="chip-text" x="1291" y="172" text-anchor="middle">16_identidade</text><line class="divider" x1="1080" y1="186" x2="1360" y2="186"/><text class="mono" x="1094" y="206">_id</text><path class="edge edge-async" d="M560,110 L440,110" marker-end="url(#seta-aberta)"/><text class="muted" x="500" y="102" text-anchor="middle">moduloId</text><path class="edge edge-async" d="M960,74 L1080,74" marker-end="url(#seta-aberta)"/><text class="muted" x="1020" y="66" text-anchor="middle">contaId</text><path class="edge edge-async" d="M912,350 L912,278" marker-end="url(#seta-aberta)"/><text class="muted" x="920" y="320" text-anchor="start">contratacaoId</text><path class="node-note" d="M1080,274 H1313 L1325,286 V362 H1080 Z"/><text class="muted" x="1092" y="296" text-anchor="start">Sem chave estrangeira no banco:</text><text class="muted" x="1092" y="314" text-anchor="start">a aplicação confere contaId,</text><text class="muted" x="1092" y="332" text-anchor="start">moduloId, contratacaoId e as</text><text class="muted" x="1092" y="350" text-anchor="start">referências a usuarios ao gravar.</text><path class="node-note" d="M1080,386 H1294 L1306,398 V492 H1080 Z"/><text class="muted" x="1092" y="408" text-anchor="start">Preço e faixas ficam dentro do</text><text class="muted" x="1092" y="426" text-anchor="start">módulo: mudam poucas vezes por</text><text class="muted" x="1092" y="444" text-anchor="start">ano e o módulo é lido inteiro</text><text class="muted" x="1092" y="462" text-anchor="start">para calcular (limite de 2 MB</text><text class="muted" x="1092" y="480" text-anchor="start">por documento).</text><path class="node-note" d="M1080,516 H1300 L1312,528 V604 H1080 Z"/><text class="muted" x="1092" y="538" text-anchor="start">Contratação e cobrança da mesma</text><text class="muted" x="1092" y="556" text-anchor="start">conta ficam na mesma partição:</text><text class="muted" x="1092" y="574" text-anchor="start">fechar a fatura é uma transação</text><text class="muted" x="1092" y="592" text-anchor="start">só, numa partição só.</text><path class="node-note" d="M1080,628 H1307 L1319,640 V698 H1080 Z"/><text class="muted" x="1092" y="650" text-anchor="start">Cobrança copia preço e faixas do</text><text class="muted" x="1092" y="668" text-anchor="start">fechamento: fatura fechada não</text><text class="muted" x="1092" y="686" text-anchor="start">muda (RN-194).</text><path class="edge edge-async" d="M1080,658 L960,658"/>
