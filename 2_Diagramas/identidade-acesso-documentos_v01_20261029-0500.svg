<g id="c-contas" filter="url(#sombra)"><rect class="node-green" x="40" y="0" width="420" height="360" rx="6"/></g><text class="label-strong" x="54" y="26">contas</text><rect class="chip" x="340.4" y="12" width="108" height="20" rx="10"/><text class="chip-text" x="394" y="26" text-anchor="middle">sem partição</text><line class="divider" x1="40" y1="40" x2="460" y2="40"/><text class="mono" x="54" y="60">_id</text><text class="mono" x="54" y="78">sigla</text><text class="mono" x="54" y="96">dominio</text><text class="mono" x="54" y="114">nome</text><text class="mono" x="54" y="132">tipo: INSTITUICAO | AUTONOMO | TIME_DEBOAZ</text><text class="mono" x="54" y="150">estado: ATIVA | SUSPENSA | DESATIVADA | ENCERRADA</text><text class="mono" x="54" y="168">documento · responsavel · telefone</text><text class="mono" x="54" y="186">criadaEm · ultimoAcessoMaster</text><rect class="node-blue" x="52" y="200" width="396" height="72" rx="4"/><text class="label" x="62" y="219">tempoSessao</text><text class="mono" x="66" y="240">staffNavegador · staffApp</text><text class="mono" x="66" y="258">participante</text><line class="divider" x1="40" y1="284" x2="460" y2="284"/><text class="uml-keyword" x="54" y="304">índices</text><text class="mono" x="54" y="324">único: sigla</text><text class="mono" x="54" y="342">único: dominio</text><g id="c-auditoria" filter="url(#sombra)"><rect class="node-green" x="40" y="432" width="420" height="206" rx="6"/></g><text class="label-strong" x="54" y="458">auditoria</text><rect class="chip" x="303.9" y="444" width="144" height="20" rx="10"/><text class="chip-text" x="376" y="458" text-anchor="middle">partição: contaId</text><line class="divider" x1="40" y1="472" x2="460" y2="472"/><text class="mono" x="54" y="492">_id</text><text class="mono" x="54" y="510">contaId → contas</text><text class="mono" x="54" y="528">quem → usuarios</text><text class="mono" x="54" y="546">acao · alvo</text><text class="mono" x="54" y="564">quando</text><line class="divider" x1="40" y1="580" x2="460" y2="580"/><text class="uml-keyword" x="54" y="600">índices</text><text class="mono" x="54" y="620">contaId + quando</text><g id="c-usuarios" filter="url(#sombra)"><rect class="node-green" x="580" y="0" width="440" height="478" rx="6"/></g><text class="label-strong" x="594" y="26">usuarios</text><rect class="chip" x="878.5" y="12" width="130" height="20" rx="10"/><text class="chip-text" x="943" y="26" text-anchor="middle">partição: sigla</text><line class="divider" x1="580" y1="40" x2="1020" y2="40"/><text class="mono" x="594" y="60">_id</text><text class="mono" x="594" y="78">sigla · contaId → contas</text><text class="mono" x="594" y="96">tipo: MASTER | STAFF | PARTICIPANTE</text><text class="mono" x="594" y="114">nome · nomeCurto</text><text class="mono" x="594" y="132">estado: PENDENTE | ATIVO | DESATIVADO</text><text class="mono" x="594" y="150">login  (entrada ou código de acesso)</text><text class="mono" x="594" y="168">matricula  (instituição)</text><text class="mono" x="594" y="186">resumoSenha  (sem no participante)</text><text class="mono" x="594" y="204">criadoEm · ultimoAcesso</text><rect class="node-blue" x="592" y="218" width="416" height="90" rx="4"/><text class="label" x="602" y="237">permissoes[ ]  · só no staff</text><text class="mono" x="606" y="258">moduloId → modulos</text><text class="mono" x="606" y="276">abaConfiguracao · abaUtilizacao</text><text class="mono" x="606" y="294">suspensa</text><rect class="node-blue" x="592" y="318" width="416" height="54" rx="4"/><text class="label" x="602" y="337">responsaveis[ ]  · só no participante</text><text class="mono" x="606" y="358">nome · parentesco</text><line class="divider" x1="580" y1="384" x2="1020" y2="384"/><text class="uml-keyword" x="594" y="404">índices</text><text class="mono" x="594" y="424">único: sigla + login</text><text class="mono" x="594" y="442">único: sigla + nomeCurto</text><text class="mono" x="594" y="460">sigla + estado + nome  (listas, RN-185)</text><g id="c-geracoes" filter="url(#sombra)"><rect class="node-green" x="1140" y="0" width="380" height="224" rx="6"/></g><text class="label-strong" x="1154" y="26">geracoesSenha</text><rect class="chip" x="1378.5" y="12" width="130" height="20" rx="10"/><text class="chip-text" x="1443" y="26" text-anchor="middle">partição: sigla</text><line class="divider" x1="1140" y1="40" x2="1520" y2="40"/><text class="mono" x="1154" y="60">_id</text><text class="mono" x="1154" y="78">sigla · usuarioId → usuarios</text><text class="mono" x="1154" y="96">pedidaPor → usuarios</text><text class="mono" x="1154" y="114">resumoCodigo</text><text class="mono" x="1154" y="132">pedidaEm · usadaEm</text><line class="divider" x1="1140" y1="148" x2="1520" y2="148"/><text class="uml-keyword" x="1154" y="168">índices</text><text class="mono" x="1154" y="188">sigla + usuarioId</text><text class="mono" x="1154" y="206">expira: 72 h (TTL no _ts)</text><g id="c-anonimos" filter="url(#sombra)"><rect class="node-green" x="1140" y="272" width="380" height="188" rx="6"/></g><text class="label-strong" x="1154" y="298">acessosAnonimos</text><rect class="chip" x="1378.5" y="284" width="130" height="20" rx="10"/><text class="chip-text" x="1443" y="298" text-anchor="middle">partição: sigla</text><line class="divider" x1="1140" y1="312" x2="1520" y2="312"/><text class="mono" x="1154" y="332">_id</text><text class="mono" x="1154" y="350">sigla  (conta dona da sala)</text><text class="mono" x="1154" y="368">sala · apelido</text><line class="divider" x1="1140" y1="384" x2="1520" y2="384"/><text class="uml-keyword" x="1154" y="404">índices</text><text class="mono" x="1154" y="424">único: sigla + sala + apelido</text><text class="mono" x="1154" y="442">apagado quando a sala fecha</text><g id="c-sessao" filter="url(#sombra)"><rect class="node-purple" x="1140" y="508" width="380" height="188" rx="6"/></g><text class="label-strong" x="1154" y="534">sessao:&lt;id&gt;</text><rect class="chip" x="1451.5" y="520" width="56" height="20" rx="10"/><text class="chip-text" x="1480" y="534" text-anchor="middle">Redis</text><line class="divider" x1="1140" y1="548" x2="1520" y2="548"/><text class="mono" x="1154" y="568">usuarioId → usuarios · sigla</text><text class="mono" x="1154" y="586">aparelho · quemEntrou</text><text class="mono" x="1154" y="604">ultimaAcao</text><line class="divider" x1="1140" y1="620" x2="1520" y2="620"/><text class="uml-keyword" x="1154" y="640">índices</text><text class="mono" x="1154" y="660">expira pelo tempo de sessão</text><text class="mono" x="1154" y="678">da conta (RN-183)</text><g id="c-modulos" filter="url(#sombra)"><rect class="node-external" x="580" y="550" width="260" height="80" rx="6"/></g><text class="label-strong" x="594" y="576">modulos</text><rect class="chip" x="727.7" y="562" width="100" height="20" rx="10"/><text class="chip-text" x="778" y="576" text-anchor="middle">15_catalogo</text><line class="divider" x1="580" y1="590" x2="840" y2="590"/><text class="mono" x="594" y="610">_id</text><path class="edge edge-async" d="M580,74 L460,74" marker-end="url(#seta-aberta)"/><text class="muted" x="520" y="66" text-anchor="middle">contaId</text><path class="edge edge-async" d="M1140,74 L1020,74" marker-end="url(#seta-aberta)"/><text class="muted" x="1080" y="66" text-anchor="middle">usuarioId</text><path class="edge edge-async" d="M1140,538 L1076,538 L1076,418 L1020,418" marker-end="url(#seta-aberta)"/><text class="muted" x="1084" y="530" text-anchor="start">usuarioId</text><path class="edge edge-async" d="M640,478 L640,550" marker-end="url(#seta-aberta)"/><text class="muted" x="648" y="518" text-anchor="start">moduloId (permissoes)</text><path class="edge edge-async" d="M100,432 L100,360" marker-end="url(#seta-aberta)"/><text class="muted" x="108" y="402" text-anchor="start">contaId</text><path class="node-note" d="M40,678 H491 L503,690 V766 H40 Z"/><text class="muted" x="52" y="700" text-anchor="start">Login: staff usa &lt;nome curto&gt;.&lt;sigla&gt;@deboaz.com e participante</text><text class="muted" x="52" y="718" text-anchor="start">&lt;SIGLA&gt;-&lt;NOME&gt;-&lt;4 números&gt;: a sigla vem do que a pessoa digita e</text><text class="muted" x="52" y="736" text-anchor="start">a busca fica numa partição só. A conta master entra com o domínio:</text><text class="muted" x="52" y="754" text-anchor="start">primeiro contas (único: dominio) dá a sigla, depois usuarios.</text><path class="node-note" d="M580,670 H879 L891,682 V794 H580 Z"/><text class="muted" x="592" y="692" text-anchor="start">Sem chave estrangeira no banco: a aplicação</text><text class="muted" x="592" y="710" text-anchor="start">confere contaId, moduloId e usuarioId.</text><text class="muted" x="592" y="728" text-anchor="start">Nenhum documento é apagado; conta encerrada</text><text class="muted" x="592" y="746" text-anchor="start">fica anonimizada (RN-174).</text><text class="muted" x="592" y="764" text-anchor="start">Matrícula única na instituição: conferida</text><text class="muted" x="592" y="782" text-anchor="start">pela aplicação, porque o autônomo não tem.</text>
  </g>
