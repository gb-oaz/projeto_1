t-anchor="middle">RF-93 · contrato em aberto</text></g><g id="uc-ordenar"><ellipse class="node" cx="620" cy="520" rx="170" ry="26"/><text class="label" x="620" y="518" text-anchor="middle">Ordenar a Carteira</text><text class="muted" x="620" y="535" text-anchor="middle">RF-131 · só no aparelho</text></g><g id="uc-modulo"><ellipse class="node" cx="620" cy="584" rx="170" ry="26"/><text class="label" x="620" y="582" text-anchor="middle">Abrir o módulo</text><text class="muted" x="620" y="599" text-anchor="middle">RF-96</text></g><g id="uc-perfil"><ellipse class="node" cx="620" cy="648" rx="196" ry="26"/><text class="label" x="620" y="646" text-anchor="middle">Ver o Perfil</text><text class="muted" x="620" y="663" text-anchor="middle">RF-94 · RN-127 · contrato em aberto</text></g><g id="uc-mascote"><ellipse class="node" cx="620" cy="712" rx="196" ry="26"/><text class="label" x="620" y="710" text-anchor="middle">Enviar foto ou adotar mascote</text><text class="muted" x="620" y="727" text-anchor="middle">RF-95 · RN-128 · contrato em aberto</text></g><g id="uc-trocar"><ellipse class="node" cx="620" cy="776" rx="170" ry="26"/><text class="label" x="620" y="774" text-anchor="middle">Trocar perfil</text><text class="muted" x="620" y="791" text-anchor="middle">RF-94 · 09 RF-35 · só no aparelho</text></g><rect class="boundary" x="944" y="88" width="456" height="232" rx="14"/><text class="boundary-label" x="960" y="112">17_MODULO-USUARIO-A · AUTENTICAÇÃO</text><g id="ref-quest"><ellipse class="node" cx="1172" cy="176" rx="196" ry="26"/><text class="label" x="1172" y="174" text-anchor="middle">Entrar no quest</text><text class="muted" x="1172" y="191" text-anchor="middle">RF-135 · POST /auth/quest/entrar</text></g><g id="ref-sala"><ellipse class="node" cx="1172" cy="264" rx="196" ry="26"/><text class="label" x="1172" y="262" text-anchor="middle">Entrar numa sala anônima</text><text class="muted" x="1172" y="279" text-anchor="middle">RF-136 · POST /auth/sala/entrar</text></g><rect