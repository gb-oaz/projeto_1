<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1392 1202" width="1392" height="1202">
  <title>Autorização · contrato de API</title>
  <desc>Contrato dos endereços de permissões do ms_mono, do requisito 17-b (Módulo Usuários · Autorização): ler as permissões e as concedíveis de uma pessoa, salvar o conjunto com a versão, e o histórico das mudanças. v01: criação.</desc>
  <style>
    /* ── base ─────────────────────────────────────────── */
    .bg            { fill: #0d1117; }
    :root          { background: #0d1117; } /* aberto sozinho no navegador, o fundo escuro cobre a janela toda */
    text           { font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #e6edf3; }
    .title         { font-size: 22px; font-weight: 700; fill: #f0f6fc; }
    .subtitle      { font-size: 13px; fill: #8b949e; }
    .section       { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; fill: #58a6ff; }
    .label         { font-size: 13px; fill: #e6edf3; }
    .label-strong  { font-size: 14px; font-weight: 600; fill: #f0f6fc; }
    .label-underline { text-decoration: underline; }
    .muted         { font-size: 12px; fill: #8b949e; }
    .mono          { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #8b949e; }
    .divider       { stroke: #21262d; stroke-width: 1; }
    .panel         { fill: #10151c; stroke: #21262d; stroke-width: 1; }

    /* ── nós: uma cor por papel, no máximo 4 por diagrama ── */
    .node          { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .node-face     { fill: #21262d; stroke: #30363d; stroke-width: 1.5; stroke-linejoin: round; }
    .node-blue     { fill: #0c2d4a; stroke: #58a6ff; stroke-width: 1.5; }
    .node-green    { fill: #0f2e1b; stroke: #3fb950; stroke-width: 1.5; }
    .node-purple   { fill: #271a45; stroke: #bc8cff; stroke-width: 1.5; }
    .node-orange   { fill: #3a2410; stroke: #f0883e; stroke-width: 1.5; }
    .node-red      { fill: #3b1219; stroke: #f85149; stroke-width: 1.5; }
    .node-external { fill: #1c2128; stroke: #6e7681; stroke-width: 1.5; }

    /* ── fronteiras (conta, região, rede, módulo) ─────── */
    .boundary       { fill: #161b22; fill-opacity: 0.35; stroke: #484f58; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .boundary-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #8b949e; }

    /* ── arestas e comunicação ─────────────────────────── */
    .edge          { fill: none; stroke: #8b949e; stroke-width: 1.5; }
    .edge-accent   { fill: none; stroke: #58a6ff; stroke-width: 1.8; }
    .edge-async    { stroke-dasharray: 6 4; }
    .edge-data     { stroke-dasharray: 1 5; stroke-linecap: round; stroke-width: 2.2; }
    .edge-label-bg { fill: #0d1117; }
    .arrow-head    { fill: #8b949e; }
    .arrow-accent  { fill: #58a6ff; }
    .lifeline      { stroke: #30363d; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .chip          { fill: #21262d; stroke: #30363d; stroke-width: 1; }
    .chip-text     { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #c9d1d9; }

    /* ── ícones neutros (#ic-*, #uml-*) ───────────────── */
    .ico           { fill: none; stroke: #c9d1d9; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .ico-fill      { fill: #c9d1d9; }
    .ico-solid     { fill: #161b22; stroke: #c9d1d9; stroke-width: 1.5; stroke-linejoin: round; }

    /* ── notação UML ───────────────────────────────────── */
    .ink           { fill: #e6edf3; }
    .ink-ring      { fill: none; stroke: #e6edf3; stroke-width: 1.5; }
    .node-note     { fill: #2b2311; stroke: #d29922; stroke-width: 1.2; }
    .uml-keyword   { font-size: 11px; font-style: italic; fill: #8b949e; }
    .activation    { fill: #21262d; stroke: #8b949e; stroke-width: 1.2; }
    .frame-tag     { fill: #21262d; stroke: #484f58; stroke-width: 1.2; }
    .frame-op      { font-size: 11px; font-weight: 700; fill: #c9d1d9; }
    .arrow-open    { fill: none; stroke: #8b949e; stroke-width: 1.4; stroke-linejoin: round; }
    .arrow-hollow  { fill: #0d1117; stroke: #8b949e; stroke-width: 1.2; stroke-linejoin: round; }

    /* ── marca d'água: topo e rodapé (seção 7) ────────── */
    .wm-band       { fill: #11161e; }
    .wm-accent     { fill: url(#marca-acento); }
    .wm-sep        { stroke: #30363d; stroke-width: 1; }
    .wm-frame      { fill: none; stroke: #30363d; stroke-width: 1; }
    .wm-eyebrow    { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; fill: #58a6ff; }
    .wm-meta-label { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; fill: #6e7681; }
    .wm-meta-value { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #e6edf3; }
    .wm-badge      { fill: #0c2d4a; stroke: #58a6ff; stroke-width: 1; }
    .wm-badge-text { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #79c0ff; }
    .wm-file       { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #6e7681; }
    .footer        { font-size: 12px; fill: #6e7681; }
  </style>
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="marca-acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect class="bg" x="0" y="0" width="1392" height="1202"/>
  <g id="marca-topo">
    <rect class="wm-band" x="0" y="0" width="1392" height="112"/>
    <rect class="wm-accent" x="0" y="110" width="1392" height="2"/>
    <text class="wm-eyebrow" x="40" y="40">BOAZ · CONTRATO DE API</text>
    <text class="title" x="40" y="72">Autorização · conceder permissões</text>
    <text class="subtitle" x="40" y="94">Ler e salvar as permissões de uma pessoa e o histórico das mudanças</text>
    <text class="wm-meta-label" x="1104" y="44">VERSÃO</text>
    <rect class="wm-badge" x="1104" y="56" width="48" height="22" rx="11"/><text class="wm-badge-text" x="1128" y="71" text-anchor="middle">v01</text>
    <line class="wm-sep" x1="1176" y1="32" x2="1176" y2="80"/>
    <text class="wm-meta-label" x="1200" y="44">DATA</text>
    <text class="wm-meta-value" x="1200" y="72">2026-11-01 · 13:25</text>
  </g>
  <g id="comum"><path class="node-note" d="M40,152 H1336 L1352,168 V302 H40 Z"/><text class="boundary-label" x="64" y="180">COMUM A TODOS OS ENDEREÇOS</text>
    <text class="mono" x="64" y="204">Toda resposta de erro: { "codigo": "PERMISSAO_ACIMA", "mensagem": "Você não tem mais a Presença para conceder." }</text>
    <text class="mono" x="64" y="226">Permissões: mapa do ID do registro de módulos (MOD-NN) para as abas "C", "U" ou "CU"; "Administrar usuários" é "MOD-03": "CU" (RN-251)</text>
    <text class="mono" x="64" y="248">Quem concede: administrador do deboaz aos membros do time; conta master e staff com Administrar usuários ao staff abaixo (RN-252)</text>
    <text class="mono" x="64" y="270">Toda rota declara o que exige (RNF-220): MOD-03 · U e a ordem de superior, conferidos no servidor com as permissões atuais, não as do token (RN-241)</text>
    <text class="mono" x="64" y="292">Token com pv antigo: 401 PERMISSOES_DESATUALIZADAS; a web e o mobile renovam (POST /auth/renovar) e montam a casca de novo (RF-148)</text>
  </g>
  <g id="ep-get-usuarios-id-permissoes">
    <g filter="url(#sombra)"><rect class="node" x="40" y="350" width="632" height="310" rx="10"/></g>
    <rect class="node-green" x="56" y="366" width="40" height="24" rx="6"/><text class="label-strong" x="76" y="383" text-anchor="middle">GET</text>
    <text class="label-strong" x="108" y="383">/usuarios/{id}/permissoes</text><text class="muted" x="656" y="383" text-anchor="end">RF-160 · RN-252 · Usuários RF-107 e RF-155</text>
    <line class="divider" x1="40" y1="406" x2="672" y2="406"/><text class="boundary-label" x="56" y="428">PEDIDO</text>
    <text class="mono" x="56" y="452">Authorization: Bearer &lt;token&gt;   exige MOD-03 · U e ser superior (RN-169)</text>
    <text class="mono" x="56" y="470">id: usr-ebfga-maria (staff) ou usr-dboaz-caio (membro do time)</text>
    <line class="divider" x1="40" y1="490" x2="672" y2="490"/><text class="boundary-label" x="56" y="512">RESPOSTAS</text>
    <rect class="chip" x="56" y="522" width="40" height="20" rx="4"/><text class="chip-text" x="76" y="536" text-anchor="middle">200</text>
    <text class="mono" x="108" y="536">{ "usuario": "usr-ebfga-maria", "versao": 6,</text>
    <text class="mono" x="108" y="562">  "mods": { "MOD-03": "CU", "MOD-08": "C" },</text>
    <text class="mono" x="108" y="588">  "concediveis": [ { "mod": "MOD-06", "nome": "Presença", "abas": "CU" }, … ] }</text>
    <rect class="node-red" x="56" y="600" width="40" height="20" rx="4"/><text class="chip-text" x="76" y="614" text-anchor="middle">403</text>
    <text class="mono" x="108" y="614">ACESSO_NEGADO · sem Usuários ou a pessoa não está abaixo</text>
    <rect class="node-red" x="56" y="626" width="40" height="20" rx="4"/><text class="chip-text" x="76" y="640" text-anchor="middle">404</text>
    <text class="mono" x="108" y="640">USUARIO_INEXISTENTE · inclusive o de outra conta (RN-235)</text>
  </g>
  <g id="ep-put-usuarios-id-permissoes">
    <g filter="url(#sombra)"><rect class="node" x="720" y="350" width="632" height="380" rx="10"/></g>
    <rect class="node-blue" x="736" y="366" width="40" height="24" rx="6"/><text class="label-strong" x="756" y="383" text-anchor="middle">PUT</text>
    <text class="label-strong" x="788" y="383">/usuarios/{id}/permissoes</text><text class="muted" x="1336" y="383" text-anchor="end">RF-161 · RF-162 · RN-241 · RN-254 · RN-255</text>
    <line class="divider" x1="720" y1="406" x2="1352" y2="406"/><text class="boundary-label" x="736" y="428">PEDIDO</text>
    <text class="mono" x="736" y="452">If-Match: "6"   a versão lida no GET (RNF-222)</text>
    <text class="mono" x="736" y="470">{ "mods": { "MOD-03": "CU", "MOD-06": "U", "MOD-08": "C" } }</text>
    <text class="mono" x="736" y="488">  o conjunto inteiro: módulo fora do mapa é retirado</text>
    <line class="divider" x1="720" y1="508" x2="1352" y2="508"/><text class="boundary-label" x="736" y="530">RESPOSTAS</text>
    <rect class="chip" x="736" y="540" width="40" height="20" rx="4"/><text class="chip-text" x="756" y="554" text-anchor="middle">200</text>
    <text class="mono" x="788" y="554">{ "versao": 7, "mods": { … } }   pv da pessoa + 1 nas sessões dela</text>
    <text class="mono" x="788" y="580">sem mudança: 200 com a mesma versão, sem subir o pv</text>
    <rect class="node-red" x="736" y="592" width="40" height="20" rx="4"/><text class="chip-text" x="756" y="606" text-anchor="middle">403</text>
    <text class="mono" x="788" y="606">PERMISSAO_ACIMA · { "mod": "MOD-06", "abas": "U" } que quem concede não tem</text>
    <rect class="node-red" x="736" y="618" width="40" height="20" rx="4"/><text class="chip-text" x="756" y="632" text-anchor="middle">403</text>
    <text class="mono" x="788" y="632">ACESSO_NEGADO · a si mesmo, a um par ou a um superior</text>
    <rect class="node-red" x="736" y="644" width="40" height="20" rx="4"/><text class="chip-text" x="756" y="658" text-anchor="middle">412</text>
    <text class="mono" x="788" y="658">VERSAO_DESATUALIZADA · { "versao": 7 } outra pessoa salvou antes</text>
    <rect class="node-red" x="736" y="670" width="40" height="20" rx="4"/><text class="chip-text" x="756" y="684" text-anchor="middle">422</text>
    <text class="mono" x="788" y="684">MODULO_NAO_CONTRATADO · { "mod": "MOD-12" }</text>
    <rect class="node-red" x="736" y="696" width="40" height="20" rx="4"/><text class="chip-text" x="756" y="710" text-anchor="middle">428</text>
    <text class="mono" x="788" y="710">VERSAO_AUSENTE · pedido sem If-Match</text>
  </g>
  <g id="ep-get-usuarios-id-permissoes-historico">
    <g filter="url(#sombra)"><rect class="node" x="40" y="762" width="632" height="258" rx="10"/></g>
    <rect class="node-green" x="56" y="778" width="40" height="24" rx="6"/><text class="label-strong" x="76" y="795" text-anchor="middle">GET</text>
    <text class="label-strong" x="108" y="795">/usuarios/{id}/permissoes/historico</text><text class="muted" x="656" y="795" text-anchor="end">RN-256</text>
    <line class="divider" x1="40" y1="818" x2="672" y2="818"/><text class="boundary-label" x="56" y="840">PEDIDO</text>
    <text class="mono" x="56" y="864">Authorization: Bearer &lt;token&gt;   mesmas exigências do GET</text>
    <text class="mono" x="56" y="882">?ate=2026-11-01T13:00:00Z   página de 50, da mais nova para a mais antiga</text>
    <line class="divider" x1="40" y1="902" x2="672" y2="902"/><text class="boundary-label" x="56" y="924">RESPOSTAS</text>
    <rect class="chip" x="56" y="934" width="40" height="20" rx="4"/><text class="chip-text" x="76" y="948" text-anchor="middle">200</text>
    <text class="mono" x="108" y="948">[ { "em": "2026-11-01T13:20:00Z", "por": "usr-ebfga-master",</text>
    <text class="mono" x="108" y="974">    "versao": 7, "antes": { "MOD-06": null }, "depois": { "MOD-06": "U" } } ]</text>
    <rect class="node-red" x="56" y="986" width="40" height="20" rx="4"/><text class="chip-text" x="76" y="1000" text-anchor="middle">404</text>
    <text class="mono" x="108" y="1000">USUARIO_INEXISTENTE</text>
  </g>
  <g id="marca-rodape" transform="translate(0,1060)">
    <rect class="wm-band" x="0" y="0" width="1392" height="142"/>
    <line class="wm-sep" x1="0" y1="0.5" x2="1392" y2="0.5"/>
    <text class="wm-eyebrow" x="40" y="30">LEGENDA</text>
    <rect class="node-blue" x="40" y="47" width="14" height="14" rx="3"/><text class="label" x="62" y="58">PUT</text>
    <rect class="node-green" x="111" y="47" width="14" height="14" rx="3"/><text class="label" x="133" y="58">GET</text>
    <rect class="node-red" x="182" y="47" width="14" height="14" rx="3"/><text class="label" x="204" y="58">resposta de erro (4xx)</text>
    <rect class="chip" x="390" y="47" width="14" height="14" rx="3"/><text class="label" x="412" y="58">resposta de sucesso</text>
    <rect class="node-note" x="576" y="47" width="14" height="14" rx="3"/><text class="label" x="598" y="58">regra comum a todos</text>
    <rect class="node" x="762" y="47" width="14" height="14" rx="3"/><text class="label" x="784" y="58">endereço</text>
    <line class="divider" x1="40" y1="88" x2="1352" y2="88"/>
    <text class="footer" x="40" y="116">v01 · criação: 3 endereços de permissões com pedido, respostas e códigos de erro</text>
    <text class="wm-file" x="1352" y="116" text-anchor="end">autorizacao-contrato-api_v01_20261101-1325.svg</text>
  </g>
</svg>
