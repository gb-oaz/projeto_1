    <marker id="seta-destaque" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-accent"/>
    </marker>
    <marker id="seta-aberta" viewBox="-1 -1 12 12" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" class="arrow-open"/>
    </marker>
    <marker id="heranca" viewBox="-1 -1 14 14" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" class="arrow-hollow"/>
    </marker>
    <marker id="extensao" viewBox="-1 -1 14 14" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" class="arrow-head"/>
    </marker>
    <marker id="composicao" viewBox="-1 -1 16 10" refX="14" refY="4" markerWidth="16" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,4 L7,0 L14,4 L7,8 z" class="arrow-head"/>
    </marker>
    <marker id="agregacao" viewBox="-1 -1 16 10" refX="14" refY="4" markerWidth="16" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,4 L7,0 L14,4 L7,8 z" class="arrow-hollow"/>
    </marker>
    <marker id="er-um" viewBox="0 0 16 12" refX="16" refY="6" markerWidth="16" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M6,0 V12 M10,0 V12" class="arrow-open"/>
    </marker>
    <marker id="er-muitos" viewBox="0 0 16 12" refX="16" refY="6" markerWidth="16" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M4,0 V12 M6,6 L16,0 M6,6 L16,12" class="arrow-open"/>
    </marker>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="marca-acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>

  </defs>
  <rect class="bg" x="0" y="0" width="1840" height="1436"/>
  <g id="marca-topo"><rect class="wm-band" x="0" y="0" width="1840" height="112"/><rect class="wm-accent" x="0" y="110" width="1840" height="2"/><text class="wm-eyebrow" x="40" y="40">BOAZ · UML SEQUÊNCIA</text><text class="title" x="40" y="72">Inicialização · contas iniciais</text><text class="subtitle" x="40" y="94">Key Vault → variáveis de ambiente → validação → contas garantidas e de volta ao estado inicial</text><text class="wm-meta-label" x="1552" y="44">VERSÃO</text><rect class="wm-badge" x="1552" y="56" width="48" height="22" rx="11"/><text class="wm-badge-text" x="1576" y="71" text-anchor="middle">v04</text><line class="wm-sep" x1="1624" y1="32" x2="1624" y2="80"/><text class="wm-meta-label" x="1648" y="44">DATA</text><text class="wm-meta-value" x="1648" y="72">2026-11-11 · 23:16</text></g>
  <g id="desenho" transform="translate(0,152)"><rect class="boundary" x="872" y="616" width="912" height="264" rx="6"/><path class="frame-tag" d="M872,616 H928 V630 L920,638 H872 Z"/><text class="frame-op" x="880" y="631">opt</text><text class="muted" x="940" y="632">[AMBIENTE = hml]</text><rect class="boundary" x="40" y="320" width="1760" height="680" rx="6"/><path class="frame-tag" d="M40,320 H96 V334 L88,342 H40 Z"/><text class="frame-op" x="48" y="335">alt</text><text class="muted" x="108" y="336">[falta segredo, senha fraca (RNF-202) ou, em hml, a lista de módulos iniciais ausente ou inválida (RNF-226)]</text><line class="lifeline" x1="40" y1="448" x2="1800" y2="448"/><text class="muted" x="108" y="466">[todos os segredos presentes e válidos]</text><line class="lifeline" x1="160" y1="64" x2="160" y2="1016"/><line class="lifeline" x1="464" y1="64" x2="464" y2="1016"/><line class="lifeline" x1="768" y1="64" x2="768" y2="1016"/><line class="lifeline" x1="1072" y1="64" x2="1072" y2="1016"/><line class="lifeline" x1="1376" y1="64" x2="1376" y2="1016"/><line class="lifeline" x1="1680" y1="64" x2="1680" y2="1016"/><rect class="activation" x="762" y="216" width="12" height="784"/><rect class="activation" x="1066" y="504" width="12" height="448"/><g id="p-kv" filter="url(#sombra)"><rect class="node-external" x="40" y="0" width="240" height="64" rx="10"/></g><text class="label-strong" x="160" y="28" text-anchor="middle">Key Vault do ambiente</text><text class="muted" x="160" y="48" text-anchor="middle">usuario-admin-* · usuario-qa-*</text><g id="p-aca" filter="url(#sombra)"><rect class="node-external" x="344" y="0" width="240" height="64" rx="10"/></g><text class="label-strong" x="464" y="28" text-anchor="middle">Container Apps</text><text class="muted" x="464" y="48" text-anchor="middle">revisão do backend-mono</text><g id="p-partida" filter="url(#sombra)"><rect class="node-purple" x="648" y="0" width="240" height="64" rx="10"/></g><text class="label-strong" x="768" y="28" text-anchor="middle">:Partida</text><text class="muted" x="768" y="48" text-anchor="middle">ms_mono · primario</text><g id="p-uc" filter="url(#sombra)"><rect class="node-green" x="952" y="0" width="240" height="64" rx="10"/></g><text class="label-strong" x="1072" y="28" text-anchor="middle">:InicializarContas</text><text class="muted" x="1072" y="48" text-anchor="middle">core usuarios · usecases (a criar)</text><g id="p-out" filter="url(#sombra)"><rect class="node-purple" x="1256" y="0" width="240" height="64" rx="10"/></g><text class="label-strong" x="1376" y="28" text-anchor="middle">:UsuariosNoBanco</text><text class="muted" x="1376" y="48" text-anchor="middle">+ ContasNoBanco · infra/out</text><g id="p-db" filter="url(#sombra)"><rect class="node-external" x="1560" y="0" width="240" height="64" rx="10"/></g><text class="label-strong" x="1680" y="28" text-anchor="middle">MongoDB</text><text class="muted" x="1680" y="48" text-anchor="middle">contas · usuarios</text><line class="edge" x1="456" y1="112" x2="168" y2="112" marker-end="url(#seta)"/><rect class="edge-label-bg" x="176" y="92" width="464" height="16"/><text class="muted" x="180" y="104">1: ler os segredos usuario-* (identidade gerenciada, Key Vault Secrets User)</text><line class="edge edge-async" x1="168" y1="160" x2="456" y2="160" marker-end="url(#seta-aberta)"/><rect class="edge-label-bg" x="176" y="140" width="242" height="16"/><text class="muted" x="180" y="152">2: valores, só na memória da plataforma</text><line class="edge-accent" x1="472" y1="208" x2="760" y2="208" marker-end="url(#seta-destaque)"/><rect class="edge-label-bg" x="480" y="188" width="380" height="16"/><text class="muted" x="484" y="200">3: start do contêiner com USUARIO_* como variáveis de ambiente</text><path class="edge" d="M776,256 H816 V280 H778" marker-end="url(#seta)"/><text class="muted" x="828" y="266">4: ler AMBIENTE e USUARIO_ADMIN_*; em prd ignorar USUARIO_QA_* (RN-266)</text><text class="muted" x="844" y="284">em hml também USUARIO_QA_*: entradas, senhas (com a do qaadmin), código do qapart e a lista USUARIO_QA_MODULOS com as partes "staff" e "time" (RN-268)</text><path class="edge" d="M776,352 H816 V376 H778" marker-end="url(#seta)"/><text class="muted" x="828" y="368">5: log com o nome da variável que falta (ex.: USUARIO_QA_ADMIN_SENHA, USUARIO_QA_MODULOS) ou da senha fora da RNF-202, nunca o valor</text><line class="edge edge-async" x1="760" y1="416" x2="472" y2="416" marker-end="url(#seta-aberta)"/><rect class="edge-label-bg" x="480" y="396" width="488" height="16"/><text class="muted" x="484" y="408">6: encerra com código ≠ 0: a revisão não fica pronta nem atende pedido (RNF-226)</text><line class="edge-accent" x1="776" y1="496" x2="1064" y2="496" marker-end="url(#seta-destaque)"/><rect class="edge-label-bg" x="784" y="476" width="512" height="16"/><text class="muted" x="788" y="488">7: Executar(ContasIniciais, ModulosIniciais) · só em memória; em prd sem módulos</text><line class="edge" x1="1080" y1="544" x2="1368" y2="544" marker-end="url(#seta)"/><rect class="edge-label-bg" x="1088" y="524" width="350" height="16"/><text class="muted" x="1092" y="536">8: garantir conta-dboaz e usr-dboaz-admin (ADMINISTRADOR)</text><line class="edge" x1="1384" y1="592" x2="1672" y2="592" marker-end="url(#seta)"/><rect class="edge-label-bg" x="1260" y="572" width="404" height="16"/><text class="muted" x="1264" y="584">9: upsert pelo _id: cadastro se faltar; resumoSenha e ATIVO sempre</text><line class="edge" x1="1080" y1="680" x2="1368" y2="680" marker-end="url(#seta)"/><rect class="edge-label-bg" x="1088" y="660" width="536" height="16"/><text class="muted" x="1092" y="672">10: garantir conta-qains e conta-qaaut com dados fictícios (RN-269); contratam só a parte "staff"</text><line class="edge" x1="1080" y1="728" x2="1368" y2="728" marker-end="url(#seta)"/><rect class="edge-label-bg" x="1088" y="708" width="430" height="16"/><text class="muted" x="1092" y="720">11: garantir usr-dboaz-qaadmin (ADMINISTRADOR) e usr-dboaz-qamembro</text><line class="edge" x1="1080" y1="776" x2="1368" y2="776" marker-end="url(#seta)"/><rect class="edge-label-bg" x="1088" y="756" width="474" height="16"/><text class="muted" x="1092" y="768">12: garantir master QAINS, master QAAUT, qastaff e qapart, nomes fictícios</text><line class="edge" x1="1080" y1="824" x2="1368" y2="824" marker-end="url(#seta)"/><rect class="edge-label-bg" x="1088" y="804" width="576" height="16"/><text class="muted" x="1092" y="816">13: voltar ao estado inicial: ATIVO, senha do Key Vault; mods do qastaff = "staff", do qamembro = "time"</text><line class="edge" x1="1384" y1="872" x2="1672" y2="872" marker-end="url(#seta)"/><rect class="edge-label-bg" x="1045" y="852" width="619" height="16"/><text class="muted" x="1049" y="864">14: upsert pelo _id: cadastro e auditoria só se faltar; estado, senha, mods e contratacoes sempre</text><line class="edge edge-async" x1="1064" y1="920" x2="776" y2="920" marker-end="url(#seta-aberta)"/><rect class="edge-label-bg" x="784" y="900" width="392" height="16"/><text class="muted" x="788" y="912">15: contas garantidas (sem senha no retorno nem no log, RNF-225)</text><line class="edge edge-async" x1="760" y1="968" x2="472" y2="968" marker-end="url(#seta-aberta)"/><rect class="edge-label-bg" x="480" y="948" width="332" height="16"/><text class="muted" x="484" y="960">16: /health pronto: a revisão recebe o primeiro pedido</text><path class="node-note" d="M40,1032 H1788 L1800,1044 V1144 H40 Z"/><text class="muted" x="52" y="1054">Sem tela: a inicialização roda antes do primeiro pedido, então esta sequência não tem faixa de telas. Siglas iniciadas por "QA" só nascem aqui: em prd o POST /contas as recusa (RN-179).</text><text class="muted" x="52" y="1072">Ids e entradas: usr-dboaz-admin (admin.dboaz@deboaz.com) · usr-dboaz-qaadmin (qaadmin.dboaz@deboaz.com) · usr-dboaz-qamembro (qamembro.dboaz@deboaz.com) · usr-qains-master (qa_instituicao@deboaz.com) ·</text><text class="muted" x="52" y="1090">usr-qaaut-master (qa_autonomo@deboaz.com) · usr-qains-qastaff (qastaff.qains@deboaz.com) · usr-qains-qapart (QAINS-QAPART-0001). Nomes e documentos fictícios no formato do projeto (RN-269).</text><text class="muted" x="52" y="1108">USUARIO_QA_MODULOS { "staff": { "mods": … }, "time": { "mods": … } }: "staff" vira contratacoes da QAINS e da QAAUT e mods do qastaff; "time" vira só mods do qamembro, sem contratação.</text><text class="muted" x="52" y="1126">Mudança feita por um teste (estado, senha, abas) volta na próxima partida à parte de cada conta: o qastaff às abas de "staff" e o qamembro às de "time" (RN-267, RN-268).</text></g>
  <g id="marca-rodape" transform="translate(0,1336)"><rect class="wm-band" x="0" y="0" width="1840" height="116"/><line class="wm-sep" x1="0" y1="0.5" x2="1840" y2="0.5"/><text class="wm-eyebrow" x="40" y="30">LEGENDA</text><rect class="node-external" x="40" y="47" width="14" height="14" rx="3"/><text class="label" x="62" y="58">serviço externo</text><rect class="node-purple" x="201.0" y="47" width="14" height="14" rx="3"/><text class="label" x="223.0" y="58">adaptador do ms_mono</text><rect class="node-green" x="399.0" y="47" width="14" height="14" rx="3"/><text class="label" x="421.0" y="58">caso de uso do core</text><rect class="node-note" x="589.6" y="47" width="14" height="14" rx="3"/><text class="label" x="611.6" y="58">nota</text><line class="edge-accent" x1="669.2" y1="54" x2="697.2" y2="54" marker-end="url(#seta-destaque)"/><text class="label" x="711.2" y="58">chamada principal</text><line class="edge" x1="865.0" y1="54" x2="893.0" y2="54" marker-end="url(#seta)"/><text class="label" x="907.0" y="58">chamada</text><line class="edge edge-async" x1="986.8" y1="54" x2="1014.8" y2="54" marker-end="url(#seta-aberta)"/><text class="label" x="1028.8" y="58">retorno</text><line class="divider" x1="40" y1="76" x2="1800" y2="76"/><text class="footer" x="40" y="100">v04 · :Partida no adaptador primário ms_mono/primario/ (antes infra/in, a criar)</text><text class="wm-file" x="1800" y="100" text-anchor="end">usuario-inicializacao-sequencia_v04_20261111-2316.svg</text></g>
