    <symbol id="ic-banco-nosql" viewBox="0 0 24 24"><rect class="ico" x="7" y="2" width="14" height="16" rx="1.5"/><path class="ico" d="M4,6 V20.5 C4,21.3 4.7,22 5.5,22 H16 M10,7 H18 M10,10.5 H18 M10,14 H15"/></symbol>
