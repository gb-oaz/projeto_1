# RNF-21 (03_ci-qualidade): pull requests de atualização de dependências,
# imagens Docker e actions. O GitHub só lê este arquivo em .github/.
# Diretórios com curinga cobrem serviços e apps que ainda vão ser criados.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/4_CI_CD/github/actions/*"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # backend, apps .NET MAUI e projetos de teste xUnit
  - package-ecosystem: nuget
    directories:
      - "/5_DEV/backend/*"
      - "/5_DEV/frontend/mob_*"
      - "/5_DEV/qa/backend/*"
      - "/5_DEV/qa/frontend/mob_*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # aplicações web (pnpm é tratado pelo ecossistema npm)
  - package-ecosystem: npm
    directories:
      - "/5_DEV/frontend/web_*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directories:
      - "/5_DEV/backend/*"
      - "/5_DEV/frontend/web_*"
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories:
      - "/"
      - "/5_DEV"
    schedule:
      interval: weekly
