# =============================================================================
# CI e qualidade — requisito 1_Requisitos/03_ci-qualidade.html
# Publicação das imagens — requisito 1_Requisitos/04_publicacao-imagens.html
# =============================================================================
#
# Visão geral do fluxo:
#
#   push / pull request
#           │
#           ▼
#     ┌──────────┐  1. descobre quais frentes mudaram (dorny/paths-filter)
#     │ mudancas │  2. lista as pastas de projeto dessas frentes
#     └────┬─────┘
#          ├──► backend               Linux, a solution de 5_DEV/backend/
#          ├──► web                   Linux, o projeto de 5_DEV/frontend/web/
#          ├──► android               Linux, a solution de 5_DEV/frontend/mobile/
#          ├──► ios                   macOS, só em PR/merge na master
#          │
#          ├──► qa                    depois de backend e web: aplicações em
#          │                          contêiner e suítes de 5_DEV/qa/
#          ├──► qa-mobile             Android em emulador, só em PR/merge na master
#          ▼
#     ┌───────────┐
#     │ resultado │  veredito único exigido pela proteção da master
#     └────┬──────┘
#          │  só na master ou na tag vX.Y.Z, com tudo verde e imagem a gerar
#          ▼
#     ┌───────────┐
#     │ aprovacao │  abre uma issue e espera alguém comentar "approve"
#     └────┬──────┘
#          ▼
#     ┌──────────────────────┐
#     │ publicar · <imagem>  │  build da imagem e envio ao Docker Hub
#     └──────────────────────┘
#
# Frente sem mudança (ou ainda sem projeto) é pulada.
# Enquanto não houver código em 5_DEV/, só "mudancas" e "resultado" rodam.
# Branches de tarefa/correção e pull requests nunca chegam à aprovação (RNF-31).
#
# Imagens fixas dos executores: ubuntu-24.04 nos jobs Linux e macos-26 no iOS.
# O ubuntu-latest passou ao 26.04, de kernel 6.19+, em que o mongo:8.0 se
# recusa a iniciar (SERVER-121912: kernels 6.19 a 7.0.13); só trocar quando
# a imagem nova tiver kernel 7.0.14 ou mais novo.
#
# Convenções das pastas de 5_DEV/ (o CI depende delas) — 14_estrutura-projetos:
#   backend/                  Boaz.slnx na raiz (core/, ms_mono/, tests/)
#   frontend/web/             package.json + pnpm-lock.yaml na raiz; um app por
#                             pasta em apps/<app>/; o script build lê o app da
#                             variável APP
#   frontend/mobile/          Boaz.Mobile.slnx na raiz; um projeto .NET MAUI por
#                             app em apps/<app>/, que gera o Android e o iOS
#   frontend/Directory.Build.props   propriedades comuns do mobile (TFMs, Xcode)
#   qa/<alvo>/<tipo>/         uma suíte de qa por pasta, com o próprio
#                             Dockerfile (backend/integracao, backend/carga,
#                             frontend/web/funcional); a carga roda só em
#                             qa-carga.yml; frontend/mobile/funcional roda na
#                             máquina, pelo executar.sh (Appium)
#   raiz do repositório       global.json (SDK .NET e workloads), .xcode-version
#                             (Xcode do iOS) e .nvmrc (Node.js) — RNF-19
#   5_DEV/backend/Dockerfile        imagem backend-mono
#   5_DEV/frontend/web/Dockerfile   imagem frontend-<app> de cada app, com o
#                                   argumento APP (_ vira -),
#                                   ex.: APP=landing_page → frontend-landing-page
#
# Configuração no GitHub (Settings → Environments → dockerhub-publish), RNF-33:
#   - secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN (token de leitura e escrita)
#   - Deployment branches and tags: branch "master" e tag "v*"
# =============================================================================

name: CI

# -----------------------------------------------------------------------------
# Gatilhos
#   push em qualquer branch e pull request (RNF-23): build e testes
#   push na master (merge): também publica as imagens alteradas (RNF-29)
#   tag vX.Y.Z: testa tudo e publica as quatro imagens (RNF-30, RNF-38)
# Com "tags" declarado, "branches: ['**']" mantém o disparo em todas as branches.
# -----------------------------------------------------------------------------
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

# -----------------------------------------------------------------------------
# Concorrência — um novo push na mesma branch cancela a execução anterior
# ainda em andamento, para não gastar minutos com um commit já superado.
# Push e pull request ficam em grupos separados (event_name no nome do grupo).
# Na master e nas tags não cancela: cada merge publica só o que ele mudou, e
# cancelar um deles deixaria imagens sem publicar; as execuções entram em fila.
# -----------------------------------------------------------------------------
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref_type != 'tag' }}

# -----------------------------------------------------------------------------
# Permissões do token do GitHub — só leitura.
#   contents       checkout do código
#   pull-requests  o paths-filter consulta a API para listar os arquivos do PR
# -----------------------------------------------------------------------------
permissions:
  contents: read
  pull-requests: read

# Variáveis para todos os jobs: deixa a saída do dotnet limpa e sem telemetria
# e define a conta do Docker Hub que recebe as imagens (RNF-32).
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOCKERHUB_NAMESPACE: gustavoboaz

jobs:
  # ===========================================================================
  # JOB 1 · mudancas — decide O QUE roda (RNF-34, RNF-35)
  # ---------------------------------------------------------------------------
  # Saídas: backend=true|false, a lista JSON de apps da web e do mobile, por
  # exemplo
  #   backend=true  web=["hub","landing_page","quest"]  android=["hub","quest"]
  # e a lista de imagens a gerar (RNF-27, RNF-38), por exemplo
  #   imagens=[{"nome":"frontend-hub","contexto":"5_DEV/frontend/web","app":"hub"}]
  # O job publicar usa a lista de imagens como matriz.
  # ===========================================================================
  mudancas:
    name: Detectar mudanças
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.pastas.outputs.backend }}
      web: ${{ steps.pastas.outputs.web }}
      android: ${{ steps.pastas.outputs.android }}
      ios: ${{ steps.pastas.outputs.ios }}
      imagens: ${{ steps.pastas.outputs.imagens }}
    steps:
      - uses: actions/checkout@v4

      # Passo 1 · paths-filter: para cada filtro abaixo responde "true" se algum
      # arquivo alterado casa com os padrões.
      #   - pull request: compara com a branch base do PR
      #   - push na master: compara com o commit anterior ao push
      #   - push em outra branch: compara com a master (tudo o que a branch mudou)
      # "comum" é uma âncora YAML (&comum) reaproveitada em todas as frentes:
      # mudar um arquivo comum liga todas elas (RNF-35).
      # Na tag vX.Y.Z o filtro não roda: todas as frentes são ligadas no passo 2.
      - uses: dorny/paths-filter@v3
        if: github.ref_type != 'tag'
        id: filtro
        with:
          filters: |
            comum: &comum
              - '.github/**'
              - 'global.json'
              - '.xcode-version'
              - '.nvmrc'
              - '**/docker-compose*.yml'
              - '**/compose*.yml'
            backend:
              - *comum
              - '5_DEV/backend/**'
              - '5_DEV/qa/backend/**'
            web:
              - *comum
              - '5_DEV/frontend/web/**'
              - '5_DEV/qa/frontend/web/**'
            mobile:
              - *comum
              - '5_DEV/frontend/Directory.Build.props'
              - '5_DEV/frontend/mobile/**'
              - '5_DEV/qa/frontend/mobile/**'

      # Passo 2 · pastas: o paths-filter só diz "mudou ou não"; aqui a frente
      # que mudou só roda se já tiver projeto, e os apps viram listas.
      #   - backend: true se a frente mudou e há .sln/.slnx em 5_DEV/backend/
      #   - web, android, ios: nomes das pastas de apps/ (web: com o
      #     package.json do projeto; mobile: com .csproj); [] se não mudou
      # Ex.: 5_DEV/frontend/mobile/apps/hub/Hub.csproj → "hub" (5º trecho do caminho)
      # nullglob: um padrão sem correspondência some, em vez de virar texto literal.
      #
      # Imagens (RNF-27, RNF-38): o backend gera a imagem backend-mono e cada app
      # da web gera frontend-<app>, só quando a frente está na lista e o
      # Dockerfile existe (sem ele, um aviso aparece no resumo do job).
      - id: pastas
        env:
          TAG: ${{ github.ref_type == 'tag' }}
          BACKEND: ${{ steps.filtro.outputs.backend }}
          WEB: ${{ steps.filtro.outputs.web }}
          MOBILE: ${{ steps.filtro.outputs.mobile }}
        run: |
          shopt -s nullglob
          if [ "$TAG" = true ]; then BACKEND=true WEB=true MOBILE=true; fi
          apps() { # $1 = frente mudou?  $2... = caminhos dentro de apps/<app>/
            if [ "$1" != true ] || [ $# -lt 2 ]; then echo '[]'; return; fi
            shift; printf '%s\n' "$@" | cut -d/ -f5 | sort -u | jq -R . | jq -sc .
          }
          projeto_backend=(5_DEV/backend/*.sln 5_DEV/backend/*.slnx)
          backend=false
          [ "$BACKEND" = true ] && [ ${#projeto_backend[@]} -gt 0 ] && backend=true
          web='[]'
          [ -f 5_DEV/frontend/web/package.json ] && web="$(apps "$WEB" 5_DEV/frontend/web/apps/*/)"
          mobile='[]'
          projeto_mobile=(5_DEV/frontend/mobile/*.sln 5_DEV/frontend/mobile/*.slnx)
          [ ${#projeto_mobile[@]} -gt 0 ] && mobile="$(apps "$MOBILE" 5_DEV/frontend/mobile/apps/*/*.csproj)"

          imagens="$(
            {
              [ "$backend" = true ] && echo "backend-mono 5_DEV/backend -"
              for app in $(jq -r '.[]' <<<"$web"); do
                echo "frontend-$(tr _ - <<<"$app") 5_DEV/frontend/web $app"
              done
            } | while read -r nome contexto app; do
              [ "$app" = - ] && app=""
              if [ -f "$contexto/Dockerfile" ]; then
                jq -nc --arg nome "$nome" --arg contexto "$contexto" --arg app "$app" '$ARGS.named'
              else
                echo "::warning::$contexto não tem Dockerfile: a imagem $nome não será gerada" >>"$RUNNER_TEMP/avisos"
              fi
            done | jq -sc .
          )"
          cat "$RUNNER_TEMP/avisos" 2>/dev/null || true

          {
            echo "backend=$backend"
            echo "web=$web"
            echo "android=$mobile"
            echo "ios=$mobile"
            echo "imagens=$imagens"
          } | tee -a "$GITHUB_OUTPUT"

  # ===========================================================================
  # JOB 2 · backend — a solution de 5_DEV/backend/ (RNF-11, RNF-13)
  # ---------------------------------------------------------------------------
  # Sequência: format → build → testes com cobertura → mínimo de 80 %.
  # A solution reúne core/, ms_mono/ e tests/; qualquer passo que falhar
  # reprova o backend.
  # ===========================================================================
  backend:
    name: Backend
    needs: mudancas
    if: needs.mudancas.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    # RNF-37: MongoDB e Redis sobem como contêineres ao lado do job, nas versões
    # de 01_stack-desenvolvimento, para os testes de integração.
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        # sem health check, o job segue mesmo com o MongoDB fora do ar
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8.0
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    # Strings de conexão lidas pelo .NET (ConnectionStrings:MongoDb / :Redis).
    env:
      ConnectionStrings__MongoDb: mongodb://localhost:27017
      ConnectionStrings__Redis: localhost:6379
    # Todos os comandos "run" executam na raiz do backend.
    defaults:
      run:
        working-directory: 5_DEV/backend
    steps:
      - uses: actions/checkout@v4
      # SDK .NET na versão exata fixada no global.json (RNF-01, RNF-19).
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Conjunto de workloads do workloadVersion do global.json, só os
      # manifestos (nenhum workload): sem ele, o build falha mesmo num projeto
      # que não usa workloads.
      - run: dotnet workload update
      # RNF-15: falha se o código não estiver formatado conforme o .editorconfig.
      - run: dotnet format --verify-no-changes
      # RNF-22: avisos dos analisadores viram erro.
      - run: dotnet build -c Release -warnaserror
      # RNF-14: testes xUnit da solution (unitários e de integração); o coverlet
      # grava a cobertura em cobertura/**/coverage.cobertura.xml.
      - run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --results-directory "$GITHUB_WORKSPACE/cobertura"
      # RNF-25: soma a cobertura e reprova abaixo de 80 % de linhas
      # (thresholds "80 90" = mínimo 80, faixa "saudável" a partir de 90).
      # Sem testes não há arquivo de cobertura e o passo também falha.
      - uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: cobertura/**/coverage.cobertura.xml
          fail_below_min: true
          thresholds: "80 90"
          format: markdown
          output: both

  # ===========================================================================
  # JOB 3 · web — o projeto de 5_DEV/frontend/web/ (RNF-11, RNF-13)
  # ---------------------------------------------------------------------------
  # Sequência: install → lint → formatação → tipos → testes + cobertura, uma
  # vez para o projeto inteiro (core/ e apps/); depois o build de cada app,
  # com o app na variável APP. Os testes de ponta a ponta são do job qa.
  # Os comandos rodam com pnpm exec, nas versões fixadas no package.json.
  # ===========================================================================
  web:
    name: Web
    needs: mudancas
    if: needs.mudancas.outputs.web != '[]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 5_DEV/frontend/web
    steps:
      - uses: actions/checkout@v4
      # Node.js na versão do .nvmrc (RNF-04, RNF-19).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # RNF-12: o Corepack ativa o pnpm na versão do campo packageManager.
      - run: corepack enable
      # --frozen-lockfile: falha se o pnpm-lock.yaml não bater com o package.json.
      - run: pnpm install --frozen-lockfile
      # RNF-17: ESLint (nenhum aviso permitido), Prettier e vue-tsc reprovam o build.
      - run: pnpm exec eslint . --max-warnings 0
      - run: pnpm exec prettier --check .
      - run: pnpm exec vue-tsc --build --force
      # RNF-16 / RNF-25: Vitest + Vue Test Utils (unitários e de componentes);
      # cobertura de linhas < 80 % reprova.
      - run: pnpm exec vitest run --coverage.enabled --coverage.thresholds.lines=80
      # Build de produção do Vite de cada app (RNF-188); um app que falha não
      # interrompe os outros, mas reprova o job.
      - env:
          APPS: ${{ needs.mudancas.outputs.web }}
        run: |
          falhou=0
          for app in $(jq -r '.[]' <<<"$APPS"); do
            echo "::group::$app"
            APP=$app pnpm run build || { echo "::error::$app reprovado"; falhou=1; }
            echo "::endgroup::"
          done
          exit $falhou

  # ===========================================================================
  # JOB 4 · android — a solution de 5_DEV/frontend/mobile/ (RNF-11, RNF-13)
  # ---------------------------------------------------------------------------
  # Mesma sequência do backend, com o workload MAUI Android e o JDK: compila
  # core/, os apps (net10.0-android) e tests/, e roda os testes. No Linux os
  # projetos não declaram o net10.0-ios (5_DEV/frontend/Directory.Build.props).
  # A cobertura é medida e publicada, sem reprovar (RNF-26).
  # ===========================================================================
  android:
    name: Android
    needs: mudancas
    if: needs.mudancas.outputs.android != '[]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 5_DEV/frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # JDK exigido pelo build Android do .NET MAUI.
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"
      - run: dotnet workload install maui-android
      - run: dotnet format --verify-no-changes # RNF-15
      - run: dotnet build -c Release -warnaserror # RNF-22
      - run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --results-directory "$GITHUB_WORKSPACE/cobertura" # RNF-14
      # RNF-26: a cobertura vira artefato para download na página da execução.
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-mobile
          path: cobertura/

  # ===========================================================================
  # JOB 5 · ios — o iOS de cada app de 5_DEV/frontend/mobile/apps/ (RNF-11, RNF-13)
  # ---------------------------------------------------------------------------
  # Roda em macOS (o build iOS exige Xcode), que custa mais por minuto; por isso
  # só em pull request para a master e no merge nela (RNF-24). Os testes já
  # rodam no job android; aqui entram o format (no macOS os projetos também
  # declaram o net10.0-ios) e o build iOS de cada app.
  # ===========================================================================
  ios:
    name: iOS
    needs: mudancas
    if: >-
      needs.mudancas.outputs.ios != '[]' && (
        (github.event_name == 'pull_request' && github.base_ref == 'master') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    # Imagem fixa: tem o Xcode de .xcode-version; macos-latest muda de macOS
    # e de Xcodes instalados sem aviso.
    runs-on: macos-26
    defaults:
      run:
        working-directory: 5_DEV/frontend/mobile
    steps:
      - uses: actions/checkout@v4
      # Xcode de .xcode-version, cujo SDK iOS é o do workload fixado no
      # global.json (workloadVersion) — ver 5_DEV/frontend/Directory.Build.props
      # (RNF-170).
      - run: sudo xcode-select -s "/Applications/Xcode_$(tr -d ' \n' < "$GITHUB_WORKSPACE/.xcode-version").app"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # No macOS os projetos declaram Android e iOS: a restauração pede os dois.
      - run: dotnet workload install maui-ios maui-android
      - run: dotnet format --verify-no-changes # RNF-15
      # RNF-22: Debug compila para o simulador, que não exige certificado de
      # assinatura; um app que falha não interrompe os outros.
      - env:
          APPS: ${{ needs.mudancas.outputs.ios }}
        run: |
          falhou=0
          for app in $(jq -r '.[]' <<<"$APPS"); do
            echo "::group::$app"
            dotnet build apps/$app -f net10.0-ios -c Debug -warnaserror || { echo "::error::$app reprovado"; falhou=1; }
            echo "::endgroup::"
          done
          exit $falhou

  # ===========================================================================
  # JOB 6 · qa — suítes de integração e funcionais de 5_DEV/qa/ (RNF-194)
  # ---------------------------------------------------------------------------
  # Depois de backend e web aprovados (ou pulados), sobe o backend e todos os
  # apps da web em contêiner, pelos Dockerfiles das imagens, e roda cada suíte
  # pela própria imagem (14_estrutura-projetos, RNF-191). Usa a mesma etapa do
  # CI local (ci.sh --so-qa): o que passa lá passa aqui. A carga não roda aqui
  # (RN-156), só em qa-carga.yml. Os JUnit XML viram artefato.
  # ===========================================================================
  qa:
    name: QA
    needs: [mudancas, backend, web]
    if: >-
      always() &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.mudancas.outputs.backend == 'true' || needs.mudancas.outputs.web != '[]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./4_CI_CD/local/ci.sh --tudo --so-qa --qa todos
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-qa
          path: 4_CI_CD/local/.gerado/resultados/
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 7 · qa-mobile — funcional do mobile com Appium (03 RNF-197, 14 RNF-196)
  # ---------------------------------------------------------------------------
  # Só em PR para a master e no merge nela, como o iOS (custo e tempo do
  # emulador). Roda no Android: o emulador sobe no executor Linux, que também
  # roda o backend em contêiner. O iOS funcional fica no CI local, porque o
  # executor macOS do GitHub não roda contêineres. Usa a mesma etapa do CI
  # local (ci.sh --so-qa --qa mobile); o JUnit XML vira artefato.
  # ===========================================================================
  qa-mobile:
    name: QA · mobile
    needs: [mudancas, backend, android]
    if: >-
      always() &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      needs.mudancas.outputs.android != '[]' && (
        (github.event_name == 'pull_request' && github.base_ref == 'master') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"
      - run: dotnet workload install maui-android
      # Node.js do .nvmrc: o qa-mobile.sh instala o Appium e os drivers do
      # package.json da suíte, nas versões fixadas lá
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # aceleração do emulador no executor Linux
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ./4_CI_CD/local/ci.sh --tudo --so-qa --qa mobile
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-qa-mobile
          path: 4_CI_CD/local/.gerado/resultados/
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 8 · resultado — veredito único do CI (RNF-36)
  # ---------------------------------------------------------------------------
  # É o único status check exigido na proteção da master. Como os jobs que rodam
  # mudam a cada PR, a regra da branch não pode listar todos; este job os resume.
  #   if: always()  → roda mesmo quando algum job anterior falhou ou foi pulado
  #   success / skipped     → passa (frente sem mudança não bloqueia o merge)
  #   failure / cancelled   → falha
  # ===========================================================================
  resultado:
    name: CI · resultado
    needs: [mudancas, backend, web, android, ios, qa, qa-mobile]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # ===========================================================================
  # JOB 9 · aprovacao — pede aprovação manual antes de publicar (04_publicacao-imagens)
  # ---------------------------------------------------------------------------
  # Só roda quando há o que publicar e é permitido publicar:
  #   - push na master (merge) ou tag vX.Y.Z (RNF-29, RNF-30); nunca em
  #     branches de tarefa/correção nem em pull requests (RNF-31)
  #   - "resultado" passou, ou seja, todos os jobs disparados passaram (RNF-28)
  #   - a lista de imagens não está vazia
  # A action trstringer/manual-approval (Manual Workflow Approval) abre uma issue
  # no repositório listando as imagens e espera um aprovador comentar
  # "approve" (aprova) ou "deny" (nega). Negar, ou o tempo acabar, falha o job e
  # nada é publicado. Enquanto espera, o job ocupa um executor Linux.
  # ===========================================================================
  aprovacao:
    name: Aprovar publicação
    needs: [mudancas, resultado]
    # always(): sem ele, o GitHub aplica success(), que pula o job quando algum
    # job anterior da cadeia foi pulado (web, android, ios sem mudança), mesmo
    # com o resultado verde.
    if: >-
      always() &&
      needs.resultado.result == 'success' &&
      needs.mudancas.outputs.imagens != '[]' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    timeout-minutes: 120 # sem resposta em 2 h, a publicação é cancelada
    permissions:
      contents: read
      issues: write # a action abre e fecha a issue de aprovação
    steps:
      # RNF-30: a tag só publica se o commit dela estiver na master.
      - if: github.ref_type == 'tag'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: github.ref_type == 'tag'
        name: Conferir se a tag está na master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::A tag $GITHUB_REF_NAME aponta para um commit fora da master"
            exit 1
          fi

      # Monta a lista de imagens que vai no corpo da issue.
      - id: lista
        env:
          IMAGENS: ${{ needs.mudancas.outputs.imagens }}
        run: |
          {
            echo 'texto<<FIM'
            jq -r --arg ns "$DOCKERHUB_NAMESPACE" '.[] | "- `\($ns)/\(.nome)`"' <<<"$IMAGENS"
            echo 'FIM'
          } >>"$GITHUB_OUTPUT"

      # approvers: quem pode aprovar (usuários do GitHub separados por vírgula),
      # da variável APROVADORES do repositório; sem ela, o dono do repositório.
      # O dono aqui é a organização gb-oaz, que não pode ser responsável pela
      # issue (a action atribui a issue aos aprovadores): a variável traz os
      # usuários. O próprio autor do push pode aprovar.
      - uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ vars.APROVADORES || github.repository_owner }}
          minimum-approvals: 1
          exclude-workflow-initiator-as-approver: false
          issue-title: "Publicar imagens no Docker Hub · ${{ github.ref_name }} · ${{ github.sha }}"
          issue-body: |
            O CI de `${{ github.ref_name }}` passou e as imagens abaixo estão prontas para publicação no Docker Hub:

            ${{ steps.lista.outputs.texto }}

            Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Comente **approve** para publicar ou **deny** para cancelar.

  # ===========================================================================
  # JOB 10 · publicar — gera e envia cada imagem ao Docker Hub (RNF-27 a RNF-33)
  # ---------------------------------------------------------------------------
  # Uma execução por imagem da lista, só depois da aprovação.
  # Tags geradas (docker/metadata-action):
  #   push na master   sha-<commit curto> e master                (RNF-29)
  #   tag vX.Y.Z       X.Y.Z, X.Y e latest                        (RNF-30)
  # As credenciais vêm do environment "dockerhub-publish", restrito à master e às
  # tags v* (RNF-33).
  # ===========================================================================
  publicar:
    name: Publicar · ${{ matrix.imagem.nome }}
    needs: [mudancas, aprovacao]
    # always(): o mesmo motivo do job aprovacao
    if: always() && needs.aprovacao.result == 'success'
    runs-on: ubuntu-24.04
    environment: dockerhub-publish
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        imagem: ${{ fromJSON(needs.mudancas.outputs.imagens) }}
    steps:
      - uses: actions/checkout@v4
      # Buildx: builder do Docker com cache entre execuções.
      - uses: docker/setup-buildx-action@v3
      # RNF-33: login com o token de acesso pessoal da conta gustavoboaz.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Calcula o nome completo e as tags da imagem conforme o evento.
      # flavor latest=false: "latest" só sai da regra explícita da tag vX.Y.Z.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.imagem.nome }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=master,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      # Node.js do .nvmrc para o build da web (RNF-168); o backend ignora.
      - id: node
        run: echo "versao=$(tr -d ' \nv' < .nvmrc)" >>"$GITHUB_OUTPUT"
      # Build com o Dockerfile da pasta da frente e envio ao Docker Hub.
      # O cache do GitHub Actions (type=gha) acelera os próximos builds.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.imagem.contexto }}
          # app da web (vazio no backend): o Dockerfile único da web gera a
          # imagem do app indicado
          build-args: |
            APP=${{ matrix.imagem.app }}
            NODE_VERSION=${{ steps.node.outputs.versao }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.imagem.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagem.nome }}
