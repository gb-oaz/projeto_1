# =============================================================================
# CD · implantação num ambiente — chamado por cd.yml
# Requisito 1_Requisitos/05_cd-implantacao.md: RNF-48 a RNF-54, RN-21
#
#   terraform plan → issue de aprovação → terraform apply → verificação
#
# Esvaziar o banco (só hml, disparo manual com confirmação, RNF-227): depois da
# aprovação e antes do apply, apaga as coleções do banco pelo plano de controle
# (ARM, com a identidade OIDC do CD); a rede do Cosmos DB continua fechada
# (acesso público desligado, só private endpoint). Depois do apply, reinicia o
# backend-mono, cuja partida recria coleções, índices e contas iniciais.
#
# Tudo roda no mesmo job: o plano fica só no disco do executor e é aplicado
# exatamente como aprovado (RNF-51). Ele não vira artefato porque contém os
# segredos que o Terraform grava no Key Vault e o repositório é público (RNF-48).
# =============================================================================

name: CD · ambiente

on:
  workflow_call:
    inputs:
      ambiente:
        description: hml ou prd
        type: string
        required: true
      acao:
        description: implantar, ligar ou desligar (os dois últimos só em hml, RN-26)
        type: string
        default: implantar
      esvaziar:
        description: apagar todas as coleções do banco antes do apply (só hml, RNF-227)
        type: boolean
        default: false
      tag:
        description: tag das imagens publicadas (sha-<commit> ou X.Y.Z); vazia no disparo manual
        type: string
        default: ""
      imagens:
        description: lista JSON das imagens publicadas na execução do CI
        type: string
        required: true
      sha:
        description: commit implantado
        type: string
        required: true

jobs:
  implantar:
    name: Implantar · ${{ inputs.ambiente }}
    runs-on: ubuntu-24.04
    environment: azure-${{ inputs.ambiente }}
    # Uma implantação por ambiente por vez; a seguinte espera (RNF-53)
    concurrency:
      group: cd-${{ inputs.ambiente }}
      cancel-in-progress: false
    timeout-minutes: 180 # 2 h de aprovação + plan, apply e verificação
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      AMB: ${{ inputs.ambiente }}
      RG: deb-boaz-app-${{ inputs.ambiente }}_rg
      TF_IN_AUTOMATION: "true"
      # Login OIDC, sem segredo de cliente (RNF-52)
      ARM_USE_OIDC: "true"
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      # Segredo só como variável de ambiente; o Terraform o grava no Key Vault (RN-24)
      TF_VAR_dockerhub_token: ${{ secrets.DOCKERHUB_READ_TOKEN }}
      TF_VAR_alerta_email: ${{ vars.ALERTA_EMAIL }}
    defaults:
      run:
        working-directory: 4_CI_CD/terraform/infra # módulo raiz; valores em ../ambientes/<amb>/
    steps:
      # Nunca esvazia produção, nem por engano de quem chama
      - name: Conferir o esvaziamento
        if: inputs.esvaziar
        working-directory: .
        run: |
          if [ "$AMB" != hml ]; then
            echo "::error::Esvaziar o banco só é permitido em homologação"; exit 1
          fi
          echo "::warning::Depois da aprovação, todas as coleções do banco de $AMB serão apagadas"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6 # RNF-57, igual a infra/versions.tf
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false -backend-config="../ambientes/$AMB/backend.hcl"

      # RN-21: quem tem imagem nova recebe a tag desta execução; os demais
      # mantêm a tag que já está implantada (saída "imagens" do estado).
      # RN-26: ligado/desligado segue o estado atual, salvo no disparo manual
      - name: Tags das imagens e estado do ambiente
        env:
          TAG: ${{ inputs.tag }}
          IMAGENS: ${{ inputs.imagens }}
          ACAO: ${{ inputs.acao }}
        run: |
          atuais=$(terraform output -json imagens 2>/dev/null || echo '{}')
          case "$ACAO" in
            ligar) ligado=true ;;
            desligar) ligado=false ;;
            *) ligado=$(terraform output -json ligado 2>/dev/null || echo true) ;;
          esac
          jq -n --argjson atuais "$atuais" --argjson novas "$IMAGENS" --arg tag "$TAG" --argjson ligado "$ligado" \
            '{imagens: ($atuais + ([$novas[] | {key: ., value: $tag}] | from_entries)), ligado: $ligado}' \
            | tee imagens.auto.tfvars.json

      - name: terraform plan
        id: plan
        run: |
          terraform plan -input=false -lock-timeout=10m -var-file="../ambientes/$AMB/variaveis.tfvars" -out=tfplan
          # Resumo sem valores, para a issue de aprovação
          {
            echo 'resumo<<FIM'
            terraform show -no-color tfplan | grep -E '^Plan:|^No changes' || true
            echo
            terraform show -no-color tfplan | grep -E '^  # ' | sed 's/^  # /- `/; s/ will be /` será /; s/ must be /` precisa ser /' || true
            echo 'FIM'
          } >>"$GITHUB_OUTPUT"

      # RNF-49 e RNF-50: issue com ambiente, imagens e plano; approve, deny ou 2 h
      - name: Aprovação manual
        uses: trstringer/manual-approval@v1
        timeout-minutes: 120
        with:
          secret: ${{ github.token }}
          approvers: ${{ vars.APROVADORES || 'GustavoBoaz' }}
          minimum-approvals: 1
          exclude-workflow-initiator-as-approver: false
          issue-title: "CD ${{ inputs.ambiente }} · ${{ inputs.acao }} · ${{ inputs.tag || 'sem imagem nova' }}"
          issue-body: |
            Ação **${{ inputs.acao }}** em **${{ inputs.ambiente }}**: o plano do Terraform está pronto.

            ${{ inputs.esvaziar && '**ATENÇÃO: esta execução APAGA todas as coleções do banco de homologação antes do apply; a partida do backend-mono as recria (RNF-227).**' || '' }}

            **Imagens com a tag `${{ inputs.tag }}`:** `${{ inputs.imagens }}`

            **Plano**

            ${{ steps.plan.outputs.resumo }}

            Commit: ${{ inputs.sha }}
            Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Comente **approve** para implantar ou **deny** para cancelar.

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # RNF-227: apaga as coleções pelo plano de controle (ARM). Não toca na rede
      # do Cosmos DB: o acesso público segue desligado e o executor não alcança
      # o endpoint de dados. Papel exigido: Contributor no grupo (bootstrap.sh)
      - name: Esvaziar o banco (hml)
        if: inputs.esvaziar && inputs.ambiente == 'hml'
        env:
          CONTA: deb-boaz-app-${{ inputs.ambiente }}-cosmos
          BANCO: boaz
        run: |
          [ "$AMB" = hml ] || { echo "::error::Esvaziar só em homologação"; exit 1; }
          listar() { az cosmosdb mongodb collection list -g "$RG" -a "$CONTA" -d "$BANCO" --query "[].name" -o tsv; }
          colecoes=$(listar)
          if [ -z "$colecoes" ]; then echo "::notice::$BANCO já está vazio"; exit 0; fi
          for c in $colecoes; do
            az cosmosdb mongodb collection delete -g "$RG" -a "$CONTA" -d "$BANCO" -n "$c" --yes
            echo "✔ coleção $c apagada"
          done
          restantes=$(listar)
          if [ -n "$restantes" ]; then
            echo "::error::Coleções que não saíram: $(tr "\n" " " <<<"$restantes")"; exit 1
          fi
          echo "- banco **$BANCO** de $AMB esvaziado: $(tr "\n" " " <<<"$colecoes")" >>"$GITHUB_STEP_SUMMARY"

      # RNF-51: aplica o plano aprovado; se o estado mudou depois dele, falha
      - name: terraform apply
        run: terraform apply -input=false -lock-timeout=10m tfplan

      # Depois de esvaziar: a revisão atual do backend-mono reinicia e a partida
      # recria coleções, índices únicos (em coleção vazia) e contas iniciais.
      # Pronta e saudável em até 5 min, senão a execução falha
      - name: Reiniciar o backend-mono
        if: inputs.esvaziar && inputs.ambiente == 'hml'
        env:
          APP: backend-mono
        run: |
          if [ "$(terraform output -json ligado)" = false ]; then
            echo "::notice::$AMB desligado: a partida recria o banco ao ligar (RN-26)"; exit 0
          fi
          rev=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
          az containerapp revision restart -n "$APP" -g "$RG" --revision "$rev" -o none
          sleep 30
          for _ in $(seq 1 27); do
            read -r execucao saude < <(az containerapp revision show -n "$APP" -g "$RG" --revision "$rev" \
              --query "[properties.runningState, properties.healthState]" -o tsv | tr '\n' ' ')
            if [ "$execucao" = Running ] && [ "$saude" = Healthy ]; then
              echo "✔ $APP: revisão $rev reiniciada e saudável"; exit 0
            fi
            sleep 10
          done
          echo "::error::$APP: revisão $rev não ficou saudável em 5 min após esvaziar ($execucao/$saude); veja o log da partida"
          exit 1

      # RNF-54: a revisão nova de cada aplicação implantada fica pronta em até
      # 5 min; senão, a anterior segue atendendo e a execução falha
      - name: Verificação
        env:
          IMAGENS: ${{ inputs.imagens }}
        run: |
          if [ "$(terraform output -json ligado)" = false ]; then
            echo "::notice::$AMB desligado: aplicações em zero réplica, nada a verificar (RN-26)"; exit 0
          fi
          falhou=0
          for app in $(jq -r '.[]' <<<"$IMAGENS"); do
            pronta=""
            for _ in $(seq 1 30); do
              read -r ultima pronta_rev < <(az containerapp show -n "$app" -g "$RG" \
                --query "[properties.latestRevisionName, properties.latestReadyRevisionName]" -o tsv | tr '\n' ' ')
              if [ -n "$ultima" ] && [ "$ultima" = "$pronta_rev" ]; then pronta=1; break; fi
              sleep 10
            done
            if [ -n "$pronta" ]; then
              echo "✔ $app: revisão $ultima pronta"
            else
              echo "::error::$app: revisão $ultima não ficou pronta em 5 min; a anterior continua atendendo"
              falhou=1
            fi
          done
          exit $falhou

      - name: Endereços
        if: always()
        run: |
          terraform output -json enderecos 2>/dev/null \
            | jq -r 'to_entries[] | "- \(.key): \(.value)"' >>"$GITHUB_STEP_SUMMARY" || true
